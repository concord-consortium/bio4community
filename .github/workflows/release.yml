name: Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: The git tag for the version to use for index.html
        required: true
env:
  BUCKET: models-resources
  PREFIX: bio4community
  SRC_FILE: index-top.html
  DEST_FILE: index.html
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::612297603577:role/bio4community
          aws-region: us-east-1
      - run: >
          aws s3 cp
          "s3://$BUCKET/$PREFIX/version/$VERSION/$SRC_FILE"
          "s3://$BUCKET/$PREFIX/$DEST_FILE"
        env:
          # Read the version from the environment instead of expanding it into
          # the script, so its contents cannot be run as shell commands.
          VERSION: ${{ github.event.inputs.version }}
